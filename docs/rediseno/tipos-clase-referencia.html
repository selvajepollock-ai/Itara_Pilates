<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Itara · Tipos de clase (escritorio)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400;1,9..144,500&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#3F5B46}a:hover{color:#2F4A36}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; display: flex; min-height: 900px; background: #FFFFFF; font-family: 'Work Sans', system-ui, sans-serif; color: #2B2A26; font-variant-numeric: tabular-nums">

  <aside style="width: 248px; flex-shrink: 0; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #EEE8DF; padding: 22px 16px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
      <div style="width: 36px; height: 36px; border-radius: 999px; background: #E9DFD0; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 18px; color: #8A5A3C">I</div>
      <span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 20px">Itara</span>
    </div>
    <nav aria-label="Navegación principal" style="display: flex; flex-direction: column; gap: 2px">
      <a href="Main.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 10px; color: #3A3832; text-decoration: none; font-size: 14px">Inicio</a>
      <a href="Semana.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500">Horarios</a>
      <a href="Alumnos.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 10px; color: #3A3832; text-decoration: none; font-size: 14px">Alumnos</a>
    </nav>
  </aside>

  <main style="flex-grow: 1; min-width: 0; padding: 32px 40px 48px; box-sizing: border-box">
    <div style="max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">
      <a href="Clases.dc.html" style="font-size: 14px; font-weight: 500; text-decoration: none; align-self: flex-start">← Horarios</a>
      <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 400; font-size: 38px; line-height: 1.1">Tipos de clase</h1>
          <span style="font-size: 14.5px; color: #4A463F">Las disciplinas que ofrece el estudio. Se eligen al crear una clase.</span>
        </div>
        <button type="button" onClick="{{openModal}}" style="height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 600; white-space: nowrap">+ Nuevo tipo</button>
      </header>

      <section aria-label="Tipos activos" style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 16px; padding: 20px; border: 1px solid #EEE8DF; border-radius: 18px; box-shadow: 0 1px 2px rgba(43,42,38,0.04), 0 2px 8px rgba(43,42,38,0.05)">
          <span aria-hidden="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; background: #E4ECE5; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 24px; color: #2F4A36">R</span>
          <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
            <div style="display: flex; align-items: center; gap: 10px">
              <span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 22px">Reformer</span>
              <span style="font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: #E1EBE2; color: #2F4A36">Activo</span>
            </div>
            <span style="font-size: 14px; color: #4A463F">Pilates con máquina reformer</span>
            <span style="font-size: 13px; color: #6B6459">48 clases por semana · 3 profesores</span>
          </div>
          <button type="button" style="height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid #E2D9CC; background: #FFFFFF; font-size: 13.5px; color: #2B2A26">Editar</button>
          <button type="button" aria-label="Más acciones de Reformer: desactivar" style="width: 38px; height: 38px; border-radius: 10px; border: none; background: transparent; color: #6B6459">⋯</button>
        </div>
      </section>

      <section aria-label="Tipos inactivos" style="border: 1px solid #EEE8DF; border-radius: 16px; overflow: hidden">
        <button type="button" onClick="{{toggleInactive}}" aria-expanded="{{inactiveOpen}}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border: none; background: #FFFFFF; text-align: left; font-size: 14px; color: #4A463F">
          <span><strong style="font-weight: 600; color: #2B2A26">Inactivos (1)</strong> · no aparecen al crear clases</span>
          <span>{{chevron}}</span>
        </button>
        <sc-if value="{{inactiveOpen}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-top: 1px solid #EEE8DF; opacity: 0.85">
            <span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #F1EDE6; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 20px; color: #6B6459">M</span>
            <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
              <div style="display: flex; align-items: center; gap: 10px">
                <span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 19px; color: #6B6459">Mat</span>
                <span style="font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: #F1EDE6; color: #6B6459">Inactivo</span>
              </div>
              <span style="font-size: 13.5px; color: #6B6459">Pilates en colchoneta</span>
            </div>
            <button type="button" style="height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid #E2D9CC; background: #FFFFFF; font-size: 13.5px; color: #3F5B46; font-weight: 600">Reactivar</button>
          </div>
        </sc-if>
      </section>
    </div>
  </main>

  <sc-if value="{{modalOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(43,42,38,0.32); display: flex; align-items: flex-start; justify-content: center; padding-top: 140px">
      <div role="dialog" aria-modal="true" aria-label="Nuevo tipo de clase" style="width: 460px; background: #FFFFFF; border-radius: 18px; box-shadow: 0 24px 60px rgba(43,42,38,0.25); padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500; font-size: 24px">Nuevo tipo de clase</h2>
          <button type="button" onClick="{{closeModal}}" aria-label="Cerrar" style="width: 40px; height: 40px; border-radius: 10px; border: none; background: transparent; font-size: 18px; color: #6B6459">✕</button>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Nombre
          <input type="text" placeholder="Ej: Barre" style="height: 46px; padding: 0 12px; border: 1px solid #E2D9CC; border-radius: 12px; font-size: 15px; font-weight: 400">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Descripción <span style="font-weight: 400; font-size: 12.5px; color: #6B6459; margin-top: -4px">Opcional · la ven las alumnas</span>
          <textarea rows="3" placeholder="Ej: Clase de barra con ejercicios de ballet y pilates" style="padding: 10px 12px; border: 1px solid #E2D9CC; border-radius: 12px; font-size: 15px; font-weight: 400; resize: vertical"></textarea>
        </label>
        <div style="display: flex; justify-content: flex-end; gap: 10px">
          <button type="button" onClick="{{closeModal}}" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #E2D9CC; background: #FFFFFF; font-size: 14px">Cancelar</button>
          <button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 600">Crear tipo</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4F6B55","options":["#4F6B55","#3F5B46","#6B5B45"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { inactive: true, modal: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#4F6B55';
    const st = this.state || {};
    return {
      accent,
      inactiveOpen: !!st.inactive,
      chevron: st.inactive ? '▴' : '▾',
      toggleInactive: () => this.setState({ inactive: !st.inactive }),
      modalOpen: !!st.modal,
      openModal: () => this.setState({ modal: true }),
      closeModal: () => this.setState({ modal: false })
    };
  }
}
</script>
</body>
</html>
