<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Itara · Horario fijo (celular)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400;1,9..144,500&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#3F5B46}a:hover{color:#2F4A36}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1500px; box-sizing: border-box; background: #FFFFFF; font-family: 'Work Sans', system-ui, sans-serif; color: #2B2A26; font-variant-numeric: tabular-nums; overflow: hidden">
  <div style="padding: 24px 18px 110px; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 400; font-size: 32px; line-height: 1.1">Horarios</h1>

    <div role="tablist" aria-label="Vistas de horarios" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; background: #F5F1EB; border-radius: 12px">
      <a href="#" role="tab" aria-selected="false" style="height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 9px; font-size: 14px; color: #4A463F; text-decoration: none">Esta semana</a>
      <a href="#" role="tab" aria-selected="true" style="height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 9px; font-size: 14px; font-weight: 600; color: #2B2A26; background: #FFFFFF; box-shadow: 0 1px 3px rgba(43,42,38,0.12); text-decoration: none">Horario fijo</a>
    </div>

    <div role="tablist" aria-label="Día" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{d.active}}" onClick="{{d.pick}}" style="{{d.style}}">
          <span style="font-size: 14px; font-weight: 600">{{d.short}}</span>
          <span style="{{d.subStyle}}">{{d.summary}}</span>
        </button>
      </sc-for>
    </div>

    <span style="font-size: 13px; color: #6B6459">{{dayLabel}}: {{dayTaken}} lugares fijos ocupados · {{dayFree}} libres</span>

    <sc-for list="{{slots}}" as="s" hint-placeholder-count="8">
      <section style="border: 1px solid #EEE8DF; border-radius: 14px; box-shadow: 0 1px 2px rgba(43,42,38,0.04), 0 2px 8px rgba(43,42,38,0.05); padding: 14px">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px">
          <span style="font-size: 16px; font-weight: 600">{{s.hour}}</span>
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 13px; color: #4A463F">{{s.count}}</span>
            <span style="{{s.badgeStyle}}">{{s.badge}}</span>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px">
          <sc-for list="{{s.people}}" as="p" hint-placeholder-count="6">
            <a href="AlumnosMobile.dc.html" style="font-size: 14px; line-height: 26px; color: #2B2A26; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p}}</a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #EEE8DF; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 8px; box-sizing: border-box">
    <a href="Mobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B6459; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>Horarios</a>
    <a href="AlumnosMobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B6459; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"></path></svg>Alumnos</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B6459; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>Pagos</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B6459; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg>Más</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4F6B55","options":["#4F6B55","#3F5B46","#6B5B45"]},"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 0 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#4F6B55';
    const day = (this.state && this.state.day) || 0;
    const first = ['Karina','Sandra','Margarita','Silvia','Valentina','Nidia','Carmen','Marcio','Laura','Mónica','Gabriela','Patricia','Andrea','Claudia','Florencia','Lucía','Mariana','Paula','Romina','Verónica','Natalia','Graciela','Norma','Susana','Liliana','Cecilia','Daniela','Julieta','Sofía','Elena','Rosa','Mirta','Analía','Viviana','Gustavo','Pablo'];
    const last = ['Horianski','Cardozo','Barrientos','Imbach','Weichzel','Báez','Karg','Klauk','Pereyra','Ramírez','Gómez','Benítez','Schulz','Duarte','Fernández','Acosta','López'];
    const names = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
    const shorts = ['Lun','Mar','Mié','Jue','Vie'];
    const hours = ['07:00','08:00','09:00','10:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'];
    const fixed = {
      '07:00': [6, null, 5, null, 4], '08:00': [8, 8, 8, 7, 7], '09:00': [6, 6, 6, 6, 6],
      '10:00': [8, 8, 8, 8, null], '14:00': [5, 5, 7, 5, 5], '15:00': [4, 5, null, 5, null],
      '16:00': [7, 8, 8, 7, null], '17:00': [8, 7, 8, 8, 8], '18:00': [7, 7, 7, 8, 8],
      '19:00': [8, 7, 8, 7, 5], '20:00': [8, 8, 7, 7, null]
    };
    const CAP = 8;
    const totals = [0,1,2,3,4].map((di) => {
      let t = 0, c = 0;
      hours.forEach((h) => { const n = fixed[h][di]; if (n !== null) { t += n; c += CAP; } });
      return { t, c };
    });
    const days = shorts.map((short, i) => {
      const active = i === day;
      return {
        short,
        active,
        summary: (totals[i].c - totals[i].t) + ' libres',
        pick: () => this.setState({ day: i }),
        style: 'height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;' + (active ? 'background:' + accent + ';color:#FFFFFF;border:1px solid ' + accent : 'background:#FFFFFF;color:#2B2A26;border:1px solid #E2D9CC'),
        subStyle: 'font-size:10.5px;' + (active ? 'color:rgba(255,255,255,0.85)' : 'color:#6B6459')
      };
    });
    const slots = [];
    hours.forEach((h, hi) => {
      const n = fixed[h][day];
      if (n === null) return;
      const people = [];
      for (let i = 0; i < n; i++) {
        const fi = (day * 7 + hi * 5 + i * 3) % first.length;
        const li = (day * 3 + hi * 2 + i * 5) % last.length;
        people.push(first[fi] + ' ' + last[li]);
      }
      const freeN = CAP - n;
      slots.push({
        hour: h,
        people,
        count: n + '/' + CAP,
        badge: freeN === 0 ? 'Completa' : (freeN === 1 ? '1 libre' : freeN + ' libres'),
        badgeStyle: 'font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;' + (freeN === 0 ? 'background:#F1EDE6;color:#5E584F' : 'background:#E1EBE2;color:#2F4A36')
      });
    });
    return {
      accent,
      days,
      slots,
      dayLabel: names[day],
      dayTaken: totals[day].t,
      dayFree: totals[day].c - totals[day].t
    };
  }
}
</script>
</body>
</html>
